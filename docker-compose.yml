name: reselling-app

# Starts with no .env at all: `docker compose up -d --build`, then open
# http://localhost:3939 and create the admin account. Everything is kept in one
# folder, DATA_DIR (default ./data next to this file). Every setting is optional;
# see .env.example.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resell}
      # Optional. Leave unset and a random password is generated on first start and
      # kept in DATA_DIR/reselling-app/secrets/db_password (the app reads it there).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-resellflow}
      # Store data in a subdirectory so Postgres init doesn't trip over the
      # volume mount point's permissions/contents (common on NAS filesystems).
      PGDATA: /var/lib/postgresql/data/pgdata
    # Generate the database password on first start if .env doesn't set one, then
    # hand over to the image's normal entrypoint. Postgres only uses it when it
    # creates a new database; after that the stored password stays.
    entrypoint:
      - sh
      - -c
      - |
        f=/secrets/db_password
        if [ -z "$$POSTGRES_PASSWORD" ]; then
          if [ ! -s "$$f" ]; then
            (umask 077; tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40 > "$$f.tmp") && mv "$$f.tmp" "$$f" || exit 1
            echo "Generated a database password in the secrets folder."
          fi
          POSTGRES_PASSWORD="$$(cat "$$f")"
          export POSTGRES_PASSWORD
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - ${DATA_DIR:-./data}/reselling-app/postgres:/var/lib/postgresql/data
      - ${DATA_DIR:-./data}/reselling-app/secrets:/secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resell} -d ${POSTGRES_DB:-resellflow}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  app:
    # Builds on the host from source:  docker compose up -d --build
    build: .
    image: resellflow:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The app builds its database connection from these plus the generated
      # password. Set DATABASE_URL only for an external database (or if an older
      # .env already has it).
      POSTGRES_USER: ${POSTGRES_USER:-resell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-resellflow}
      DATABASE_URL: ${DATABASE_URL:-}
      # Optional: leave unset and a random one is generated on first boot and kept
      # in DATA_DIR/reselling-app/secrets. Placeholder/short values are refused.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Optional: create the first admin from .env instead of in the browser.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Only shown in messages, so the logs can say where the data is.
      DATA_DIR_HOST: ${DATA_DIR:-./data}
      # Older versions used APPDATA for the data folder; read only to warn about it.
      LEGACY_APPDATA: ${APPDATA:-}
      # Only used by accounts that turn on "Fetch today's rate". Set empty to disable
      # fetching server-wide (unset = default provider).
      FX_API_URL: ${FX_API_URL-https://open.er-api.com/v6/latest/USD}
      # Set to 1 only when every visitor reaches the app through a reverse proxy you
      # run (the Caddy or Tailscale profiles, with APP_BIND left at 127.0.0.1); then
      # sign-in throttling also counts failures per client IP.
      TRUST_PROXY: ${TRUST_PROXY:-}
      NODE_ENV: production
    ports:
      # Published on this machine only (127.0.0.1) by default, so other devices on
      # the same Wi-Fi/LAN can't reach the login page. To use it from other devices
      # by IP (e.g. http://<NAS-IP>:3939), set APP_BIND=0.0.0.0 in .env. The
      # Tailscale sidecar doesn't need this — it reaches the app internally.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3939}:3000"
    # Least privilege: root inside the container (some NAS setups need it to read
    # /app), but with only the file-permission capabilities it uses, no privilege
    # escalation, and a read-only filesystem apart from the data mounts + scratch.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    tmpfs:
      - /tmp
      - /root
      - /app/.next/cache
    volumes:
      - ${DATA_DIR:-./data}/reselling-app/uploads:/app/uploads
      - ${DATA_DIR:-./data}/reselling-app/secrets:/app/secrets

  # Optional: Tailscale HTTPS for the phone camera. Trusted cert, works anywhere.
  # Starts only with the "ts" profile:
  #   1) Tailscale admin → DNS → enable MagicDNS + "Enable HTTPS"
  #   2) Tailscale admin → Settings → Keys → make a reusable auth key
  #   3) put TS_AUTHKEY=tskey-... in a .env file here, then:
  #        docker compose --profile ts up -d
  #   4) open https://resellflow.<your-tailnet>.ts.net on your phone
  tailscale:
    # Minor version pinned (still gets patch releases); bump deliberately.
    image: tailscale/tailscale:v1.104
    profiles: ["ts"]
    # Shares the app's network so it can serve http://127.0.0.1:3000 over HTTPS.
    network_mode: service:app
    depends_on:
      - app
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-resellflow}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    cap_add:
      - net_admin
    volumes:
      - ${DATA_DIR:-./data}/reselling-app/tailscale:/var/lib/tailscale
      - ./deploy/serve.json:/config/serve.json:ro
    restart: unless-stopped

  # Optional HTTPS reverse proxy. Only starts with the "https" profile:
  #   SITE_ADDRESS=192.168.x.x docker compose --profile https up -d
  # Needed for the phone camera (barcode scanner requires a secure context).
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
